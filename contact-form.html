<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 3: Form-Control | Obillo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-primary">Contact Form</h2>
    
    <form class="p-4 bg-white border">
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control form-control-lg" id="fullName" placeholder="Enter Full Name" aria-label="Full Name Input" required>
            </div>
            
            <div class="col-md-6">
                <label for="emailAddr" class="form-label">Email Address</label>
                <input type="email" class="form-control form-control-sm" id="emailAddr" aria-describedby="emailHelp" required>
            </div>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="3" aria-label="Message Area" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Preferred Contact Method</label>
            <div class="row">
                <div class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="checkEmail">
                        <label class="form-check-label" for="checkEmail">Email</label>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="checkPhone">
                        <label class="form-check-label" for="checkPhone">Phone</label>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="checkWhatsApp">
                        <label class="form-check-label" for="checkWhatsApp">WhatsApp</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label for="favColor" class="form-label">Favorite Color</label>
            <input type="color" class="form-control form-control-color" id="favColor" value="#0d6efd" title="Choose your color">
        </div>

        <div class="mb-3">
            <label for="userID" class="form-label">User ID</label>
            <input type="text" class="form-control" id="userID" value="ID-12345" disabled>
        </div>

        <div class="mb-3">
            <label for="accountType" class="form-label">Account Type:</label>
            <input type="text" readonly class="form-control-plaintext" id="accountType" value="Student">
        </div>

        <button type="submit" class="btn btn-primary">Submit Form</button>
    </form>
</div>

</body>
</html>
